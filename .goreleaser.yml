before:
  hooks:
    - go mod download
builds:
  - id: "hcp"
    env:
      - CGO_ENABLED=0
    binary: hcp
    flags:
      - -trimpath
    goos:
      - linux
      # - darwin
      # - windows
    goarch:
      - amd64
#       - arm64
#       - 386
#       - arm
#     goarm:
#       - 6
#       - 7
# nfpms:
# - license: MIT
#   formats:
#   - deb
#   - rpm
#   - apk

archives:
  - id: default
    builds:
      - hcp
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: "checksums.txt"
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"